name: p2p_communicator
description: Serverless P2P messenger on the Veilid network, with PIN-unlocked rooms.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter

  # Veilid core (Rust) + Dart bindings. The package's build hook compiles
  # veilid-flutter/rust for the target, or bundles a prebuilt library.
  # Pinned to a release tag: the API still moves between 0.x versions.
  veilid:
    git:
      url: https://gitlab.com/veilid/veilid.git
      ref: v0.5.8
      path: veilid-flutter

  # Device-bound secret (Android Keystore) mixed into every PIN derivation.
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.5.3

  # Media
  image: ^4.3.0 # resize static avatars/backgrounds; GIFs stay untouched
  image_picker: ^1.2.0
  video_player: ^2.10.0
  record: ^7.1.2
  audioplayers: ^6.8.1

  # Sender avatars that stick to the bottom of their message group while
  # scrolling (Telegram style). Pinned exactly to 0.8.0 (May 2025, reviewed:
  # pure Dart rendering, no I/O): 0.9-0.11 were all published within hours
  # on 2026-11-03 after 18 months of silence, so they wait for review.
  flutter_sticky_header: 0.8.0

  # Moving to a new phone: send the sealed file (Quick Share, Bluetooth,
  # cable…) and pick it on the other side.
  share_plus: ^13.3.1
  file_selector: ^1.1.0

  # Invites
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  # DAST: feed generated images through the real ImagePicker code path
  # instead of the system gallery UI.
  image_picker_platform_interface: ^2.11.2
  # DAST: capture the shared migration file and feed it to the file picker.
  share_plus_platform_interface: ^7.2.0
  file_selector_platform_interface: ^2.7.0

flutter:
  uses-material-design: true

name: dast

# Reusable dynamic test: the real app (debug build, x86_64) runs on an Android
# emulator, joins the live Veilid network and goes through the security-
# relevant flows in integration_test/app_test.dart (room creation, wrong PIN
# opens nothing, each PIN opens only its own room). Fails on any crash of our
# process. Screenshots taken along the way are uploaded as the `screenshots`
# artifact; publishing them is up to the caller.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  emulator:
    name: DAST (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/setup
        with:
          cache-key: android-emulator

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A real phone-sized screen: taps land where users tap, and the
          # README screenshots look like a phone.
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p build
            adb logcat -c
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart || (adb logcat -d > build/logcat.txt; exit 1)
            adb logcat -d > build/logcat.txt
            ! grep -E "Process: com\.p2pcommunicator|Fatal signal.*p2pcommunicator" build/logcat.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logcat
          path: build/logcat.txt
          if-no-files-found: ignore
          retention-days: 14

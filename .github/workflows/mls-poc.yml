name: mls-poc

# v2 proof of concept (docs/PROTOCOL.md B13): OpenMLS over a mocked DHT,
# the failure scenarios F1–F19, the same scenario called from Flutter
# through FFI, and an Android bench APK for on-device measurements. Runs
# only when the PoC changes.
on:
  pull_request:
    branches: [main]
    paths:
      - "native/mls_poc/**"
      - ".github/workflows/mls-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mls-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: MLS PoC (Rust + FFI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/mls_poc/target
          key: mls-poc-${{ runner.os }}-${{ hashFiles('native/mls_poc/Cargo.lock') }}
          restore-keys: |
            mls-poc-${{ runner.os }}-

      - name: Format
        run: cargo fmt --manifest-path native/mls_poc/Cargo.toml --check

      # osv-scanner.toml ignores libcrux-kem 0.0.9 advisories because the
      # crate is only an optional, never-compiled dependency. Keep it so.
      - name: libcrux-kem stays out of the build
        run: |
          if cargo tree --manifest-path native/mls_poc/Cargo.toml --locked --target all -e normal,build -i libcrux-kem 2>/dev/null | grep -q '^libcrux-kem v'; then
            echo "libcrux-kem is now compiled: the osv-scanner.toml exception no longer holds" >&2
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --manifest-path native/mls_poc/Cargo.toml --locked --all-targets -- -D warnings

      - name: Tests (scenario + F1–F19)
        run: cargo test --manifest-path native/mls_poc/Cargo.toml --locked

      - name: Sizes and timings (release build)
        run: |
          {
            echo "## MLS PoC measurements (CI runner, release build)"
            echo '```'
            cargo test --manifest-path native/mls_poc/Cargo.toml --locked --release --test minimal -- --nocapture | grep -E '^(size|time)'
            cargo test --manifest-path native/mls_poc/Cargo.toml --locked --release --test failures f17 -- --nocapture | grep -E '^Welcome'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the FFI library
        run: cargo build --manifest-path native/mls_poc/Cargo.toml --locked

      - uses: ./.github/actions/setup
        with:
          cache-key: host-debug

      - name: Flutter → Rust through FFI
        run: flutter test native/mls_poc/flutter_test

  # B13 phone measurements: the PoC as an arm64 library (16 KB aligned) in a
  # throwaway Flutter app (android_bench/main.dart). Install the APK from the
  # artifact on a physical phone, tap Run, send the copied report. The app is
  # debug-signed and never published.
  android-bench:
    name: Android bench APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      # Java, Flutter and the 16 KB linker flag for aarch64-linux-android.
      - uses: ./.github/actions/setup
        with:
          cache-key: mls-bench

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/mls_poc/target
          key: mls-bench-${{ runner.os }}-${{ hashFiles('native/mls_poc/Cargo.lock') }}

      - name: cargo-ndk
        run: cargo install cargo-ndk --version =4.1.2 --locked

      - name: Build libmls_poc.so (arm64-v8a, release)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a --platform 24 -o "$RUNNER_TEMP/jniLibs" \
            build --manifest-path native/mls_poc/Cargo.toml --locked --release

      - name: Bench app
        run: |
          app="$RUNNER_TEMP/mls_poc_bench"
          flutter create --platforms=android --org dev.p2pc.bench \
            --project-name mls_poc_bench "$app"
          cp native/mls_poc/android_bench/main.dart "$app/lib/main.dart"
          rm -rf "$app/test"
          mkdir -p "$app/android/app/src/main/jniLibs"
          cp -r "$RUNNER_TEMP/jniLibs/." "$app/android/app/src/main/jniLibs/"
          (cd "$app" && flutter build apk --release --target-platform android-arm64)
          cp "$app/build/app/outputs/flutter-apk/app-release.apk" "$RUNNER_TEMP/mls-poc-bench.apk"

      - name: 16 KB page alignment
        run: .github/scripts/check_16k.sh "$RUNNER_TEMP/mls-poc-bench.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mls-poc-bench-apk
          path: ${{ runner.temp }}/mls-poc-bench.apk
          retention-days: 30

name: postmerge

# Every push to main (a merged PR): run the checks again on the merged code,
# then build a signed release APK and publish it as a GitHub release.
#
# Version: major.minor come from pubspec.yaml, the patch is the workflow run
# number, so every merge gets a unique, increasing version without a commit
# back to main. Bump major/minor in pubspec.yaml by hand when it matters.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postmerge
  cancel-in-progress: false

jobs:
  checks:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: host-debug

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release:
    name: build + release apk
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: android-release

      - name: Compute version
        id: version
        run: |
          base=$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\)\..*/\1/p' pubspec.yaml)
          if [ -z "$base" ]; then echo "cannot read version from pubspec.yaml" >&2; exit 1; fi
          name="$base.${GITHUB_RUN_NUMBER}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is missing; refusing to publish a debug-signed release." >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK (arm64)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}"

      - name: Prepare assets
        id: assets
        run: |
          apk="p2p-communicator-${{ steps.version.outputs.name }}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.assets.outputs.apk }}" \
            "${{ steps.assets.outputs.apk }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "P2P Communicator ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

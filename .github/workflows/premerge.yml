name: premerge

# Every pull request into main: format, analysis, unit tests, a debug APK
# build, SAST + SCA, and (when app code changed) the emulator DAST run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            app:
              - 'lib/**'
              - 'android/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'integration_test/**'
              - 'test_driver/**'
              - '.github/workflows/dast.yml'
              - '.github/actions/**'

  checks:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: host-debug

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: build debug apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: android-debug

      - name: Build debug APK (arm64, GitHub flavor)
        run: flutter build apk --debug --flavor github --target-platform android-arm64

      # The Play flavor has its own Kotlin (in-app updates): compile it on
      # every PR too, not only at release time.
      - name: Build debug app bundle (arm64, Play flavor)
        run: flutter build appbundle --debug --flavor play --target-platform android-arm64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-pr${{ github.event.pull_request.number || 'manual' }}
          path: build/app/outputs/flutter-apk/app-github-debug.apk
          retention-days: 7

  security:
    name: security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write

  dast:
    name: dast
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/dast.yml

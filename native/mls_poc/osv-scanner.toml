# Exceptions for the MLS proof of concept's Rust dependencies. Each one is
# time-limited and must be re-checked when it expires; anything else found
# in native/mls_poc/Cargo.lock fails the SCA job.

[[IgnoredVulns]]
# crypto-bigint 0.5.5: timing variability in "constant-time" operations.
# Pulled in only through elliptic-curve 0.13 (p256 / p384 / k256), which
# openmls_rust_crypto and hpke-rs-rust-crypto always link for the NIST
# ciphersuites. The PoC uses only 0x0003 (X25519 / Ed25519 /
# ChaCha20-Poly1305, curve25519-dalek) and refuses groups with any other
# ciphersuite, so this code is never executed. No fixed version is
# reachable: elliptic-curve 0.13 requires crypto-bigint 0.5.
# Before v2 ships: a provider without the NIST curves (e.g. libcrux) or an
# OpenMLS release on elliptic-curve 0.14.
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-02-09T00:00:00Z
reason = "Only in NIST-curve code paths; the PoC uses and enforces ciphersuite 0x0003 (X25519/Ed25519). No compatible fixed version."

[[IgnoredVulns]]
# libcrux-kem 0.0.9: panics on decoding too-short hybrid ML-KEM keys. It is
# in Cargo.lock only as an optional dependency of hpke-rs (feature
# "libcrux", via hpke-rs-libcrux 0.7.0, which pins =0.0.9); nothing enables
# that feature, so it is not compiled. The mls-poc workflow fails if it ever
# becomes part of the build. Fixed in 0.0.10 / hpke-rs 0.8, which
# openmls_rust_crypto 0.6.0 (hpke-rs ^0.7) cannot use yet.
id = "RUSTSEC-2026-0330"
ignoreUntil = 2027-02-09T00:00:00Z
reason = "Optional dependency not compiled (hpke-rs feature libcrux off); guarded in CI."


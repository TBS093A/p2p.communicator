[package]
name = "mls_poc"
version = "0.1.0"
edition = "2021"
publish = false
description = "Proof of concept for p2p.communicator v2: OpenMLS groups with admin-sequenced commits over a mocked DHT (docs/PROTOCOL.md B13)."

[lib]
# rlib for the Rust tests, cdylib for the Flutter FFI test.
crate-type = ["rlib", "cdylib"]

[dependencies]
# Pinned exactly (supply-chain policy: reviewed versions only, none younger
# than ~2 weeks). openmls 0.9.2: 2026-10-22; the companion crates 0.6.0:
# 2026-08-25.
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_traits = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
